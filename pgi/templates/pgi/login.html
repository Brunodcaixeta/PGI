{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PGI MPGO</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind CSS compilado -->
  <link rel="stylesheet" href="{% static 'pgi/css/output.css' %}">
</head>

<body class="bg-bg-dark font-sans antialiased min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md px-6">

    <!-- Card de Login -->
    <div class="rounded-2xl bg-surface-dark border border-white/5 p-8 shadow-2xl">

      <!-- Logo / Título -->
      <div class="text-center mb-8">
        <img src="{% static 'pgi/img/logo_pgi.png' %}" alt="PGI 2025-2027 Logo" class="h-56 w-auto object-contain mx-auto mb-4 drop-shadow-xl">
      </div>

      <!-- Mensagens de erro -->
      {% if form.errors %}
      <div class="mb-6 p-4 rounded-xl bg-error/10 border border-error/20">
        <div class="flex items-center gap-2 text-error text-sm font-medium">
          <span class="material-symbols-outlined text-lg">error</span>
          <span>Usuário ou senha incorretos. Tente novamente.</span>
        </div>
      </div>
      {% endif %}

      <!-- Formulário de Login -->
      <form method="post" id="login-form">
        {% csrf_token %}

        <!-- Campo Usuário -->
        <div class="mb-5">
          <label for="id_username" class="block text-sm font-medium text-text-muted mb-2">Usuário</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-lg">person</span>
            <input
              type="text"
              name="username"
              id="id_username"
              autofocus
              required
              placeholder="seu.usuario"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-bg-dark border border-white/10 text-sm text-text-light placeholder-text-muted/50 focus:outline-none focus:border-primary/50 focus:ring-2 focus:ring-primary/20 transition-all duration-200"
            >
          </div>
        </div>

        <!-- Campo Senha -->
        <div class="mb-6">
          <label for="id_password" class="block text-sm font-medium text-text-muted mb-2">Senha</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-lg">lock</span>
            <input
              type="password"
              name="password"
              id="id_password"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-bg-dark border border-white/10 text-sm text-text-light placeholder-text-muted/50 focus:outline-none focus:border-primary/50 focus:ring-2 focus:ring-primary/20 transition-all duration-200"
            >
          </div>
        </div>

        <!-- Botão de Login -->
        <button
          type="submit"
          id="btn-login"
          class="w-full py-3 rounded-xl bg-primary hover:bg-primary/90 text-white font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:shadow-primary/30"
        >
          <span class="material-symbols-outlined text-lg">login</span>
          Entrar
        </button>
      </form>

      <!-- Rodapé -->
      <p class="text-center text-xs text-text-muted/50 mt-8">
        Ministério Público do Estado de Goiás — SUBPLEI
      </p>
    </div>

  </div>

</body>
</html>
