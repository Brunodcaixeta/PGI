{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plano de Gestão Institucional 2025-2027 — MPGO">

  <title>{% block title %}PGI — MPGO{% endblock %}</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols (Outlined) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind CSS compilado -->
  <link rel="stylesheet" href="{% static 'pgi/css/output.css' %}">

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-bg-dark text-text-light font-sans antialiased min-h-screen">

  <div class="flex min-h-screen">

    <!-- ==================== SIDEBAR ==================== -->
    {% include 'pgi/components/sidebar.html' %}

    <!-- ==================== ÁREA PRINCIPAL ==================== -->
    <div class="flex-1 flex flex-col ml-[260px]">

      <!-- HEADER -->
      {% include 'pgi/components/header.html' %}

      <!-- CONTEÚDO DA PÁGINA -->
      <main class="flex-1 p-6 lg:p-8">
        {% block content %}{% endblock %}
      </main>

    </div>

  </div>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
