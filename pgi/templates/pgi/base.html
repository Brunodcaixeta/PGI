{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plano de Gestão Institucional 2025-2027 — MPGO">

  <title>{% block title %}PGI — MPGO{% endblock %}</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols (Outlined) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind CSS compilado -->
  <link rel="stylesheet" href="{% static 'pgi/css/output.css' %}">

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-bg-dark text-text-light font-sans antialiased min-h-screen">

  <div class="flex min-h-screen">

    <!-- ==================== SIDEBAR ==================== -->
    {% include 'pgi/components/sidebar.html' %}

    <!-- ==================== ÁREA PRINCIPAL ==================== -->
    <div class="flex-1 flex flex-col ml-[260px]">

      <!-- HEADER -->
      {% include 'pgi/components/header.html' %}

      <!-- CONTEÚDO DA PÁGINA -->
      <main class="flex-1 p-6 lg:p-8">
        {% block content %}{% endblock %}
      </main>

    </div>

  </div>

  {% block extra_scripts %}{% endblock %}

  <!-- ===== CONTAINER DE TOASTS (notificações) ===== -->
  <div id="toast-container" class="fixed top-20 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

  <script>
    /**
     * Exibe um toast de notificação temporário.
     * @param {string} message - Texto da notificação
     * @param {'success'|'error'|'info'} type - Tipo visual
     * @param {number} duration - Duração em ms (padrão 4000)
     */
    function showToast(message, type = 'success', duration = 4000) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      const colors = {
        success: 'bg-success/90 border-success/30',
        error:   'bg-error/90 border-error/30',
        info:    'bg-info/90 border-info/30',
      };
      const icons = {
        success: 'check_circle',
        error:   'error',
        info:    'info',
      };

      toast.className = `pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl border text-white text-sm font-medium shadow-2xl backdrop-blur-sm transition-all duration-300 transform translate-x-full opacity-0 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <span class="material-symbols-outlined text-lg">${icons[type] || icons.info}</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      // Animar entrada
      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-full', 'opacity-0');
      });

      // Animar saída e remover
      setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }
  </script>

</body>
</html>
