<!-- ============================================================
     SIDEBAR — Navegação principal fixa à esquerda
     Largura: 260px | Fundo: surface-dark | Altura: 100vh
     ============================================================ -->

<aside class="fixed top-0 left-0 z-40 w-[260px] h-screen bg-surface-dark flex flex-col border-r border-white/5">

  <!-- ===== LOGO / IDENTIDADE ===== -->
  <div class="p-6 pb-4">
    {% load static %}
    <img src="{% static 'pgi/img/logo_pgi.png' %}" alt="PGI 2025-2027 Logo" class="h-28 w-auto object-contain mx-auto">
  </div>

  <!-- ===== MENU DE NAVEGAÇÃO ===== -->
  <nav class="flex-1 px-3 space-y-1 overflow-y-auto">

    <!-- Item ativo: Eixos Estratégicos -->
    <a href="{% url 'pgi:home' %}"
       class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary transition-all duration-200"
       id="nav-eixos">
      <span class="material-symbols-outlined text-xl">target</span>
      <span class="text-sm font-medium">Eixos Estratégicos</span>
    </a>

    <!-- Áreas de Atuação -->
    <a href="{% url 'pgi:home' %}?visao=areas"
       class="flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 hover:text-text-light transition-all duration-200"
       id="nav-areas">
      <span class="material-symbols-outlined text-xl">apartment</span>
      <span class="text-sm font-medium">Áreas de Atuação</span>
    </a>
    <!-- Configurações -->
    {% if user.is_superuser or user.perfil == 'adm' %}
    <a href="/admin/"
       class="flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 hover:text-text-light transition-all duration-200"
       id="nav-config">
      <span class="material-symbols-outlined text-xl">settings</span>
      <span class="text-sm font-medium">Configurações</span>
    </a>
    {% else %}
    <a href="#" onclick="abrirModalPerfil(event)"
       class="flex items-center gap-3 px-4 py-3 rounded-xl text-text-muted hover:bg-white/5 hover:text-text-light transition-all duration-200"
       id="nav-config">
      <span class="material-symbols-outlined text-xl">settings</span>
      <span class="text-sm font-medium">Configurações</span>
    </a>
    {% endif %}

  </nav>

  <!-- ===== RODAPÉ DA SIDEBAR ===== -->
  <div class="p-4 border-t border-white/5 space-y-1">
    <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-xl text-text-muted hover:text-text-light transition-colors duration-200">
      <span class="material-symbols-outlined text-xl">help_outline</span>
      <span class="text-sm">Suporte</span>
    </a>
    <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-xl text-text-muted hover:text-text-light transition-colors duration-200">
      <span class="material-symbols-outlined text-xl">inventory_2</span>
      <span class="text-sm">Arquivo</span>
    </a>
  </div>

</aside>
